name: Collect frontier technology news

on:
  schedule:
    # 每周一 08:00 UTC（北京时间 16:00）运行
    - cron: "0 8 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "src/collect_news.py"
      - ".github/workflows/collect-frontier-tech.yml"

permissions:
  contents: write

jobs:
  collect:
    name: Fetch and publish research signals
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect RSS and Atom feeds
        run: python src/collect_news.py --output data/frontier-tech-news.md

      - name: Commit updated digest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/frontier-tech-news.md
          if git diff --cached --quiet; then
            echo "No new signals to publish."
          else
            git commit -m "chore: update frontier technology digest"
            git push
          fi
